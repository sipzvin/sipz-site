# Publishes site/ to GitHub Pages on every push to main. The check runs first: a broken link, a missing alt text, a script that the page's own
# policy would block, or a leftover placeholder (such as the contact email) stops the deploy.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the permissions Pages needs, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still waiting, but a running deploy is not cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-site.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
